<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0A08">
<title>El Despacho · YOD OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* El Despacho v2: una columna de celular (máx. 560px), cuatro carriles y una hoja que sube desde abajo.
   Oscuro a propósito (es la cara de la casa); tokens abajo. */
:root,html[data-tema][data-tema]{
  --bg:#0B0A08;--panel:#17140F;--panel2:#1F1A13;--hair:#2E2718;
  --ink:#F6F1E6;--ink2:#CFC6B4;--dim:#A79C88;--faint:#8B8171;
  --oro:#D8AC5C;--oro2:#EFD09A;--oroS:#221C13;
  --verde:#7FA877;--verdeS:#13201A;--rojo:#E08576;--rojoS:#2E1A16;--ambar:#E0AC4A;--lila:#B9A2E0;
  --serif:"Instrument Serif",Georgia,serif;--sans:"Instrument Sans",system-ui,-apple-system,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.w{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:18px 110px}
.fecha{font:600 11px var(--mono);letter-spacing:.12em;color:var(--dim)}
h1{font:400 34px/1.1 var(--serif);margin:4px 0 10px;text-wrap:balance}
.lat{display:inline-flex;flex-wrap:wrap;gap:8px;align-items:center;font:12px var(--mono);color:var(--verde);border:1px solid #24402a;background:var(--verdeS);border-radius:999px;padding:5px 12px}
.lat i{width:8px;height:8px;border-radius:50%;background:currentColor;flex:0 0 auto}
.lat.mal{color:var(--rojo);border-color:#4a2620;background:var(--rojoS);border-radius:14px}
.lat.esp{color:var(--dim);border-color:var(--hair);background:var(--panel)}
.lat button{font:inherit;color:inherit;background:none;border:1px solid currentColor;border-radius:8px;padding:2px 8px;cursor:pointer}
.carril{font:600 11px var(--mono);letter-spacing:.14em;color:var(--oro);margin:26px 0 8px}
.card{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--hair);border-radius:18px;padding:14px;margin-bottom:10px;color:inherit;font:inherit;cursor:pointer}
.card:active{transform:scale(.99)}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font:11px var(--mono);color:var(--dim)}
.card .t{display:block;font:500 17px/1.3 var(--sans);color:var(--ink);margin:6px 0 4px}
.card .r{display:block;font:14px var(--sans);color:var(--ink2)}
.chip{font:600 10px var(--mono);letter-spacing:.06em;padding:2px 7px;border-radius:6px;background:var(--panel2);color:var(--ink2)}
.c-urgente,.c-hoy{background:var(--rojoS);color:var(--rojo)} .c-dinero,.c-firma{background:#2A2112;color:var(--ambar)} .c-legal{background:#1E1830;color:var(--lila)}
.est{margin-top:8px;font:13px var(--sans);color:var(--dim)} .est.ok{color:var(--verde)} .est.mal{color:var(--rojo)}
.lote{background:var(--panel);border:1px solid var(--hair);border-radius:18px;padding:14px}
.lote .lt{font:500 17px var(--sans)}
.lote .lr{margin:8px 0 4px;border-top:1px solid var(--hair)}
.li{display:flex;justify-content:space-between;gap:10px;width:100%;background:none;border:0;border-bottom:1px solid var(--hair);color:var(--ink2);font:14px var(--sans);text-align:left;padding:10px 0;cursor:pointer;min-height:44px}
.li span{min-width:0} .li em{font-style:normal;color:var(--faint);font-size:12px;white-space:nowrap}
.acc{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.acc button,.acc .btn{flex:1 1 auto;min-height:48px;padding:0 16px;border-radius:14px;border:1px solid var(--hair);background:var(--panel2);color:var(--ink);font:500 15px var(--sans);cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none}
.acc button.si{background:var(--oro);color:#1a1408;border-color:var(--oro);font-weight:600}
.acc button.baja{background:none;color:var(--faint);border-color:transparent}
.acc button.mic{flex:0 0 56px;font-size:18px} .acc button.mic.on{background:var(--rojoS);border-color:var(--rojo)}
.acc button:disabled{opacity:.45}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--oro);outline-offset:2px}
.conf{width:100%;font:14px var(--sans);color:var(--ink2);margin-top:4px}
.msg{font:13.5px var(--sans);color:var(--dim);margin-top:8px;min-height:1em} .msg.ok{color:var(--verde)} .msg.mal{color:var(--rojo)}
.min{display:flex;gap:12px;align-items:center;margin:4px 0 10px}
.min b{font:44px/1 var(--serif);color:var(--oro)} .min span{font:13px var(--sans);color:var(--dim)} .min small{color:var(--faint)}
.hecho{display:flex;gap:8px;align-items:baseline;font:14px var(--sans);color:var(--dim);padding:9px 0;border-bottom:1px solid var(--hair)}
.hecho b{font-weight:500;color:var(--verde)} .hecho b.x{color:var(--faint)} .hecho span{margin-left:auto;color:var(--faint);font:12px var(--mono);white-space:nowrap}
.vacio{margin-top:26px;padding:18px;border:1px dashed var(--hair);border-radius:18px;color:var(--dim);font:14px var(--sans)}
.pie{margin-top:36px;display:flex;gap:10px;flex-wrap:wrap}
.pie a{font:13px var(--sans);color:var(--dim);border:1px solid var(--hair);border-radius:12px;padding:10px 12px;text-decoration:none}
/* hoja */
#velo{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:3000}
#hoja{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;z-index:3001;background:#120F0B;border-top:1px solid var(--hair);border-radius:24px 24px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom,0px));max-width:600px;margin:0 auto}
.asa{width:44px;height:5px;border-radius:3px;background:var(--hair);margin:4px auto 10px}
.cerrar{position:absolute;right:12px;top:10px;width:44px;height:44px;border-radius:50%;border:1px solid var(--hair);background:var(--panel);color:var(--ink2);font-size:16px;cursor:pointer}
.hm{display:flex;gap:6px;align-items:center;font:11px var(--mono);color:var(--dim);letter-spacing:.08em}
#hoja h2{font:400 26px/1.15 var(--serif);margin:8px 48px 6px 0;text-wrap:balance}
.para{font:12px var(--mono);color:var(--dim)}
.falta{margin-top:8px;padding:12px;border-radius:14px;background:#2A2112;color:var(--oro2);font:15px var(--sans)}
.cuerpo{margin-top:12px;background:var(--panel);border:1px solid var(--hair);border-radius:16px;padding:14px;font:15px/1.6 var(--sans);color:#E6DECF;white-space:pre-line;overflow-wrap:anywhere}
.cuerpo mark{background:#3a2c12;color:var(--oro2);border-radius:4px;padding:0 3px}
.nota{font:12.5px var(--sans);color:var(--faint);margin-top:6px}
textarea{width:100%;min-height:90px;margin-top:12px;border-radius:14px;border:1px solid var(--hair);background:var(--panel);color:var(--ink);padding:12px;font:15px var(--sans);resize:vertical}
body.hojaAbierta{overflow:hidden}
body.caido .acc button.si{opacity:.5}
@media(max-width:600px){ .w{padding-bottom:130px} }
@media (prefers-reduced-motion:no-preference){ #hoja{animation:sube .22s ease-out} @keyframes sube{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}} }
</style>
</head>
<body>
<main class="w">
  <div class="fecha" id="fecha">&nbsp;</div>
  <h1 id="saludo">El Despacho</h1>
  <div class="lat esp" id="latido"><i></i>leyendo…</div>

  <section id="cSi" aria-label="Tu sí"></section>
  <section id="cEsp" aria-label="Puede esperar"></section>
  <section id="cSolo" aria-label="Solo tú"></section>
  <div class="vacio" id="vacio" hidden></div>
  <section id="cHecho" aria-label="Lo que hice solo"></section>

  <nav class="pie">
    <a href="clasico.html">Tablero completo</a>
    <a href="EJECUTOR.md">Cómo funciona</a>
    <a href="#demo" id="lnkDemo">Ver con datos de ejemplo</a>
  </nav>
</main>
<div id="velo" hidden></div>
<div id="hoja" hidden role="dialog" aria-modal="true"></div>

<script src="app.js?v=2"></script>
<script>if(location.hash!=="#demo"){var sp=document.createElement("script");sp.src="https://yodesarrollomx.github.io/potenciales-yod/portero.js";document.body.appendChild(sp);}</script>
<script src="https://yodesarrollomx.github.io/yod-portal/chinche.js?v=ch9"></script>
<script>if(window.YODChinche) YODChinche.init({pantalla:"despacho"});</script>
<script>if(location.hash==='#demo'){var l=document.getElementById('lnkDemo');l.href='#';l.textContent='Salir del ejemplo';l.onclick=function(e){e.preventDefault();history.replaceState(null,'',location.pathname);location.reload();};}</script>
</body>
</html>
